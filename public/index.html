<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marktplatz Deutsch</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; }
        .tab-content.active { display: block; }
        nav button { padding: 10px; margin-right: 5px; cursor: pointer; }
        .active-btn { background: #007bff; color: white; }

        /* Übung 1 Styles */
        .market-grid { display: flex; gap: 20px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .market-item { font-size: 60px; cursor: pointer; padding: 20px; background: #fff; border: 3px solid #ddd; border-radius: 15px; transition: transform 0.1s; user-select: none; }
        .market-item:active { transform: scale(0.95); border-color: #007bff; }
        .grammar-box { margin-top: 30px; padding: 20px; background: #e9ecef; border-radius: 8px; font-size: 24px; text-align: center; min-height: 90px; line-height: 1.5; }
        
        /* The Didactic Signal: Red bold text for the morphological ending */
        .signal { color: #d9534f; font-weight: bold; text-decoration: underline; }
        
        .mode-switch { text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .mode-switch label { cursor: pointer; padding: 10px; }

        /* Übung 2 Styles */
        .game-arena { display: none; text-align: center; margin-top: 20px; }
        .question-box { font-size: 28px; padding: 20px; background: #fff; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
        .blank { display: inline-block; width: 60px; border-bottom: 3px solid #000; text-align: center; color: #007bff; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
        .suffix-btn { font-size: 24px; padding: 15px; border: none; border-radius: 8px; background: #e9ecef; cursor: pointer; transition: 0.2s; }
        .suffix-btn:active { transform: scale(0.95); }
        .correct { background: #28a745 !important; color: white; }
        .wrong { background: #dc3545 !important; color: white; }
        .leaderboard { margin-top: 30px; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #ccc; }
        .score-row { display: flex; justify-content: space-between; font-size: 18px; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <nav>
        <button onclick="switchTab('u1', this)" class="active-btn">1. Wimmelbild</button>
        <button onclick="switchTab('u2', this)">2. Rallye</button>
        <button onclick="switchTab('u3', this)">3. Marktschreier</button>
    </nav>

    <!-- Übung 1: Wimmelbild -->
    <div id="u1" class="tab-content active">
        <h2>Das Markt-Wimmelbild</h2>
        
        <div class="mode-switch">
            <label><input type="radio" name="case-toggle" value="nom" checked onchange="updateMode()"> 1. Erkunden (Nominativ)</label>
            <label style="margin-left: 20px;"><input type="radio" name="case-toggle" value="acc" onchange="updateMode()"> 2. Einkaufen (Akkusativ)</label>
        </div>

        <div class="market-grid">
            <div class="market-item" onclick="showGrammar('apfel')">🍎</div>
            <div class="market-item" onclick="showGrammar('gurke')">🥒</div>
            <div class="market-item" onclick="showGrammar('brot')">🍞</div>
            <div class="market-item" onclick="showGrammar('kaese')">🧀</div>
        </div>

        <div id="grammar-display" class="grammar-box">
            Tippe auf ein Lebensmittel!
        </div>
    </div>

    <!-- Übung 2: Rallye -->
    <div id="u2" class="tab-content">
        <h2>Die Markt-Rallye</h2>
        
        <!-- Phase 1: Name eingeben -->
        <div id="lobby-join" style="text-align: center; margin-bottom: 20px;">
            <h3>Wie heißt du?</h3>
            <input type="text" id="player-name" placeholder="Dein Name" style="font-size: 18px; padding: 10px;">
            <br>
            <button onclick="joinLobby()" style="font-size: 18px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">Der Lobby beitreten</button>
        </div>

        <!-- Phase 2: Warten -->
        <div id="lobby-wait" style="display: none; text-align: center; margin: 30px 0; font-size: 20px; color: #555;">
            ⏳ Warten auf den Lehrer... <br><br> (Schau nach vorne!)
        </div>

        <!-- Phase 3: Spiel (versteckt bis Lehrer startet) -->
        <div id="game-arena" class="game-arena">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px;">
                <span id="my-team-display" style="color: #007bff;">Team</span>
                <span>🔥 Streak: <span id="streak-counter">0</span></span>
            </div>

            <div class="question-box" id="question-text">Lade Frage...</div>
            
            <div class="btn-grid">
                <button class="suffix-btn" onclick="checkAnswer('-e', this)">-e</button>
                <button class="suffix-btn" onclick="checkAnswer('-en', this)">-en</button>
                <button class="suffix-btn" onclick="checkAnswer('-er', this)">-er</button>
                <button class="suffix-btn" onclick="checkAnswer('-es', this)">-es</button>
            </div>
            
            <p id="game-feedback" style="height: 20px; margin-top: 15px; font-weight: bold;"></p>
        </div>

        <div class="leaderboard" id="leaderboard-container" style="display:none;">
            <h3 style="margin-top: 0;">🏆 Live-Punktestand</h3>
            <div id="leaderboard-scores"></div>
        </div>
    </div>

    <div id="u3" class="tab-content">
        <h2>Der Marktschreier</h2>
        <div id="chat" style="height: 150px; overflow-y: scroll; border: 1px solid #ccc; margin-bottom: 10px; padding: 10px;"></div>
        <input type="text" id="msg" placeholder="Ich möchte..." style="width: 70%;">
        <button id="send-btn" onclick="sendChat()">Sagen</button>
        <p id="feedback" style="color: green; font-weight: bold;"></p>
    </div>

    <script>
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-btn'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active-btn');
        }

        const socket = io();
        socket.on('connect', () => {
            document.getElementById('ws-status').innerText = '🟢 Live mit Server verbunden';
        });
        
        function sendScore() {
            socket.emit('team_score_update', { team: 'Team A', points: 10 });
        }

        async function sendChat() {
            const input = document.getElementById('msg').value;
            if (!input) return;
            
            const btn = document.getElementById('send-btn');
            btn.disabled = true;
            btn.innerText = "Verkäufer denkt nach...";
            
            document.getElementById('chat').innerHTML += `<p><strong>Du:</strong> ${input}</p>`;
            document.getElementById('msg').value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input })
                });
                
                if (!res.ok) throw new Error("Rate limit");
                
                const data = await res.json();
                document.getElementById('chat').innerHTML += `<p><strong>Verkäufer:</strong> ${data.vendor_reply}</p>`;
                document.getElementById('feedback').innerText = data.didactic_feedback;
            } catch (e) {
                document.getElementById('feedback').innerText = "Der Markt ist gerade sehr voll! Bitte in ein paar Sekunden nochmal probieren.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Sagen";
            }
        }

        // Übung 1: Wimmelbild Logic
        let currentCase = 'nom';
        let currentItem = null;

        // Data dictionary with morphological signaling pre-formatted
        const grammarData = {
            apfel: { // Maskulinum
                nom: "d<span class='signal'>er</span> rot<span class='signal'>e</span> Apfel <br> ein rot<span class='signal'>er</span> Apfel",
                acc: "Ich sehe d<span class='signal'>en</span> rot<span class='signal'>en</span> Apfel <br> Ich sehe ein<span class='signal'>en</span> rot<span class='signal'>en</span> Apfel"
            },
            gurke: { // Femininum
                nom: "di<span class='signal'>e</span> grün<span class='signal'>e</span> Gurke <br> ein<span class='signal'>e</span> grün<span class='signal'>e</span> Gurke",
                acc: "Ich kaufe di<span class='signal'>e</span> grün<span class='signal'>e</span> Gurke <br> Ich kaufe ein<span class='signal'>e</span> grün<span class='signal'>e</span> Gurke"
            },
            brot: { // Neutrum
                nom: "da<span class='signal'>s</span> frisch<span class='signal'>e</span> Brot <br> ein frisch<span class='signal'>es</span> Brot",
                acc: "Ich nehme da<span class='signal'>s</span> frisch<span class='signal'>e</span> Brot <br> Ich nehme ein frisch<span class='signal'>es</span> Brot"
            },
            kaese: { // Maskulinum
                nom: "d<span class='signal'>er</span> alt<span class='signal'>e</span> Käse <br> ein alt<span class='signal'>er</span> Käse",
                acc: "Ich probiere d<span class='signal'>en</span> alt<span class='signal'>en</span> Käse <br> Ich probiere ein<span class='signal'>en</span> alt<span class='signal'>en</span> Käse"
            }
        };

        function updateMode() {
            // Get the currently selected radio button (nom or acc)
            currentCase = document.querySelector('input[name="case-toggle"]:checked').value;
            
            // If an item was already tapped, update the text immediately to the new case
            if (currentItem) {
                showGrammar(currentItem);
            }
        }

        function showGrammar(itemKey) {
            currentItem = itemKey;
            const display = document.getElementById('grammar-display');
            display.innerHTML = grammarData[itemKey][currentCase];
        }

        // --- Übung 2: Rallye Logic ---
        let myTeam = "";
        let currentQuestion = {};
        let streak = 0;

        const questions = [
            { text: "Ich kaufe einen frisch<span class='blank'>___</span> Käse.", answer: "-en", rule: "Akkusativ + Maskulin = -en" },
            { text: "Das ist ein alt<span class='blank'>___</span> Käse.", answer: "-er", rule: "Nominativ + Maskulin (ein) = -er" },
            { text: "Ich nehme die grün<span class='blank'>___</span> Gurke.", answer: "-e", rule: "Akkusativ + Feminin (die) = -e" },
            { text: "Wo ist das frisch<span class='blank'>___</span> Brot?", answer: "-e", rule: "Nominativ + Neutrum (das) = -e" }
        ];

        function joinLobby() {
            const name = document.getElementById('player-name').value;
            if (!name) return;
            
            socket.emit('student_join', name);
            
            document.getElementById('lobby-join').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
        }

        // Triggered by the server when the teacher puts this student in a team
        socket.on('team_assigned', (teamName) => {
            myTeam = teamName;
            document.getElementById('lobby-wait').style.display = 'none';
            document.getElementById('game-arena').style.display = 'block';
            document.getElementById('leaderboard-container').style.display = 'block';
            document.getElementById('my-team-display').innerText = `🏆 ${teamName}`;
            nextQuestion();
        });

        function nextQuestion() {
            document.querySelectorAll('.suffix-btn').forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
            });
            document.getElementById('game-feedback').innerText = "";
            currentQuestion = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('question-text').innerHTML = currentQuestion.text;
        }

        function checkAnswer(selectedSuffix, btnElement) {
            document.querySelectorAll('.suffix-btn').forEach(b => b.disabled = true);
            if (selectedSuffix === currentQuestion.answer) {
                btnElement.classList.add('correct');
                streak++;
                document.getElementById('streak-counter').innerText = streak;
                socket.emit('add_point', myTeam); // Send point to server
                setTimeout(nextQuestion, 1000);
            } else {
                btnElement.classList.add('wrong');
                streak = 0;
                document.getElementById('streak-counter').innerText = streak;
                document.getElementById('game-feedback').style.color = "red";
                document.getElementById('game-feedback').innerText = `Falsch! Regel: ${currentQuestion.rule}`;
                setTimeout(nextQuestion, 3000);
            }
        }

        socket.on('leaderboard_update', (teamsData) => {
            const board = document.getElementById('leaderboard-scores');
            board.innerHTML = "";
            const sortedTeams = Object.entries(teamsData).sort((a, b) => b[1] - a[1]);
            sortedTeams.forEach(([team, score]) => {
                board.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee;"><span>${team}</span> <strong>${score} Pts</strong></div>`;
            });
        });
    </script>
</body>
</html>
