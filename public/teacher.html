<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lehrer Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #333; color: white; }
        .panel { background: #444; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .student-item { padding: 10px; background: #555; margin: 5px 0; border-radius: 4px; display: flex; align-items: center; }
        .student-item input { margin-right: 10px; width: 20px; height: 20px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 4px; margin-right: 10px; }
        .btn-start { background: #28a745; font-weight: bold; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>
    <h1>Lehrer Dashboard</h1>
    
    <div class="panel">
        <h2>Kontrollzentrum</h2>
        <p>Aktueller Status: <strong id="status-display" style="color: #ffc107;">Freies Üben (Lokal)</strong></p>
        <button class="btn-danger" onclick="socket.emit('open_lobby')">1. Lobby öffnen (Tablets sperren)</button>
        <button class="btn-start" onclick="socket.emit('start_multiplayer')">3. Spiel Starten (60s Timer)</button>
    </div>

    <div class="panel">
        <h2>2. Teams bilden</h2>
        <p>Wähle 2 Schüler aus und klicke auf "Zusammenfügen". Der Name wird automatisch generiert (z.B. "Tomáš & Anna").</p>
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <h3>Warteraum (Lobby)</h3>
                <div id="unassigned-list">Keine Schüler in der Lobby...</div>
                <br>
                <button onclick="createTeam()">Ausgewählte zusammenfügen</button>
            </div>
            <div style="flex: 1;">
                <h3>Aktive Teams</h3>
                <div id="active-teams">Noch keine Teams erstellt.</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('teacher_update', (data) => {
            // Update Status Text
            const states = { 'practice': 'Freies Üben', 'lobby': 'Namenseingabe / Teamwahl', 'multiplayer': 'Spiel läuft!', 'scoreboard': 'Ergebnisse' };
            document.getElementById('status-display').innerText = states[data.state];

            // Render Unassigned Students
            const unassignedDiv = document.getElementById('unassigned-list');
            const teamsDiv = document.getElementById('active-teams');
            
            unassignedDiv.innerHTML = "";
            teamsDiv.innerHTML = "";
            
            Object.entries(data.players).forEach(([id, player]) => {
                if (!player.team) {
                    unassignedDiv.innerHTML += `
                        <div class="student-item">
                            <input type="checkbox" class="student-checkbox" value="${id}">
                            ${player.name}
                        </div>`;
                }
            });

            // Render Teams and Scores
            const sortedTeams = Object.entries(data.teams).sort((a, b) => b[1] - a[1]);
            sortedTeams.forEach(([teamName, score]) => {
                teamsDiv.innerHTML += `<div class="student-item" style="justify-content: space-between;"><span>👥 <strong>${teamName}</strong></span> <span>${score} Pkt</span></div>`;
            });
        });

        function createTeam() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            const studentIds = Array.from(checkboxes).map(cb => cb.value);
            
            if (studentIds.length < 2) {
                alert("Bitte wähle mindestens zwei Schüler aus!");
                return;
            }
            socket.emit('assign_team', studentIds);
        }
    </script>
</body>
</html>
